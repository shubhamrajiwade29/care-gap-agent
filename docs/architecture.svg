<svg width="680" viewBox="0 0 680 476" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Care Gap Agent architecture</title>
<desc>Three entry points (LWC, Agentforce agent, scheduled job) call two invocable Apex actions and a service layer, which calls a selector layer, which reads and writes the Care_Gap__c, Contact, and Task objects.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#73726c;stroke-width:1.2;fill:none}
</style>
</defs>

<rect x="40" y="50" width="168" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="t" x="124" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Patient Care LWC</text>
<text class="ts" x="124" y="88" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Contact record page</text>

<rect x="256" y="50" width="168" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="t" x="340" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Agentforce agent</text>
<text class="ts" x="340" y="88" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Care Gap Assistant</text>

<rect x="472" y="50" width="168" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="t" x="556" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Reminder job</text>
<text class="ts" x="556" y="88" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Scheduled · daily 7am</text>

<rect x="150" y="135" width="180" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="t" x="240" y="153" text-anchor="middle" dominant-baseline="central" fill="#3C3489">FindPatientByName</text>
<text class="ts" x="240" y="171" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Invocable Apex</text>

<rect x="350" y="135" width="180" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="t" x="440" y="153" text-anchor="middle" dominant-baseline="central" fill="#3C3489">GetPatientCareGaps</text>
<text class="ts" x="440" y="171" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Invocable Apex</text>

<rect x="150" y="212" width="380" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="t" x="340" y="230" text-anchor="middle" dominant-baseline="central" fill="#085041">CareGapService</text>
<text class="ts" x="340" y="248" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Business logic · status updates · FLS checks</text>

<rect x="150" y="288" width="380" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="t" x="340" y="306" text-anchor="middle" dominant-baseline="central" fill="#085041">CareGapSelector</text>
<text class="ts" x="340" y="324" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">SOQL · WITH SECURITY_ENFORCED</text>

<rect x="40" y="372" width="168" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
