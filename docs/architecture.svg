<rect x="150" y="444" width="11" height="11" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text class="ts" x="166" y="450" dominant-baseline="central" fill="#5F5E5A">Agentforce action</text>
<rect x="310" y="444" width="11" height="11" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text class="ts" x="326" y="450" dominant-baseline="central" fill="#5F5E5A">Apex logic</text>
<rect x="430" y="444" width="11" height="11" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text class="ts" x="446" y="450" dominant-baseline="central" fill="#5F5E5A">Data object</text>
