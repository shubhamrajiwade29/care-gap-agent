<text class="ts" x="124" y="410" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">custom object</text>

<rect x="256" y="372" width="168" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="t" x="340" y="392" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Contact</text>
<text class="ts" x="340" y="410" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">patient · standard</text>

<rect x="472" y="372" width="168" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
